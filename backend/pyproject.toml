[project]
name = "healthcare-backend"
version = "0.1.0"
description = "Healthcare AI Voice Agent - FastAPI Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlmodel>=0.0.22",
    "pydantic[email]>=2.10.4",
    "pydantic-settings>=2.7.1",
    "alembic>=1.14.1",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0,<4.2",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.1",
    "google-genai>=1.0.0",
    "assemblyai>=0.34.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.3",
    "psycopg[binary]>=3.3.2,<3.3.3",
    "apscheduler>=3.11.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
]
tts = [
    "elevenlabs>=1.51.0",
    "deepgram-sdk>=3.9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
